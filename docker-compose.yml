services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: casebook
      POSTGRES_PASSWORD: casebook
      POSTGRES_DB: casebook
    ports:
      - "5432:5432"
    volumes:
      - casebook_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casebook -d casebook"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://casebook:casebook@db:5432/casebook
      CORS_ORIGINS: http://localhost:8081
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:8000
      EXPO_NO_TELEMETRY: "1"
      BROWSER: none
    ports:
      - "8081:8081"
    stdin_open: true
    tty: true
    depends_on:
      - api

volumes:
  casebook_pg:
