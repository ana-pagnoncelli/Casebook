[project]
name = "casebook-api"
version = "0.1.0"
description = "Casebook API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.40",
  "psycopg[binary]>=3.2",
  "alembic>=1.16",
  "pydantic>=2.11",
  "pydantic-settings>=2.8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["casebook*"]
